name: parallell jobs demo
on:
  workflow_dispatch:

jobs:
  jobs1:
    runs-on: ubuntu-latest
    steps:
       - name: Job1 step
         run: echo "Job 1 running"

  jobs2:
    runs-on: ubuntu-latest
    needs: jobs1
    steps:
       - name: Job2 step
         run: echo "Job 2 running"

  jobs3:
    runs-on: ubuntu-latest
    needs: jobs2
    steps:
       - name: Job3 step
         run: echo "Job 3 running"

  jobs4:
    runs-on: ubuntu-latest
    needs: jobs3
    steps:
       - name: Job4 step
         run: echo "Job 4 running"
    
